app-id: io.github.Amethyst.ModManager
runtime: org.kde.Platform
runtime-version: "6.9"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
# PySide6 comes prebuilt from the PySide BaseApp (Flathub-standard for
# PySide apps); Qt itself is shared from the KDE runtime.
base: io.qt.PySide.BaseApp
base-version: "6.9"

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: "24.08"
    add-ld-path: .
    autodelete: false
  # 32-bit support for running Proton's bundled `wine` binary (ELF i386).
  # Version 24.08 matches KDE 6.9's Freedesktop base.
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: "24.08"
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: "1.4"
    versions: 24.08;1.4
    subdirectories: true
    no-autodownload: false
    autodelete: false
    add-ld-path: lib

command: amethyst-mod-manager

build-options:
  env:
    # cleanup-BaseApp.sh knobs - strip the QtWebEngine stack the BaseApp
    # inherits. Qt Multimedia is retained for Mod Files media previews.
    BASEAPP_REMOVE_WEBENGINE: "true"
    BASEAPP_DISABLE_NUMPY: "true"

# Sandbox permissions
# - network: Nexus API send/receive, version checks, downloads
# - x11 + wayland sockets: Qt picks Wayland natively when the session offers
#   it and falls back to X11 otherwise.
# - pulseaudio: audio preview playback
# - dri: GPU rendering
# - home: mod staging (user-configurable path, e.g. anywhere in ~/), game paths, Steam libraries.
#   NOTE: app config does NOT live in ~/.config here - flatpak redirects
#   XDG_CONFIG_HOME, so it lands in ~/.var/app/<app-id>/config/AmethystModManager
#   (separate from a native/AppImage install's ~/.config/AmethystModManager).
# - run/media, media, mnt: Steam libraries on SD cards and removable drives (Steam Deck, etc.)
# - ~/.var/app/com.valvesoftware.Steam: Steam Flatpak data (home excludes ~/.var/app)
# - ~/.var/app/com.heroicgameslauncher.hgl: Heroic Flatpak
# - ~/.var/app/net.lutris.Lutris: Lutris Flatpak (pga.db, game configs, wine runners)
# - ~/.var/app/io.github.Faugus.faugus-launcher: Faugus Flatpak (games.json, config.json)
# - talk-name=org.freedesktop.secrets: keyring (Nexus API key storage and retrieval)
finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl
  - --filesystem=~/.var/app/net.lutris.Lutris
  - --filesystem=~/.var/app/io.github.Faugus.faugus-launcher
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
  # Wine (Synthesis prefix setup) installs its own seccomp filter and runs
  # 32-bit binaries; the default sandbox blocks both, killing wine with SIGSYS.
  - --allow=multiarch
  - --env=MOD_MANAGER_GAMES=/app/share/amethyst-mod-manager/Games
  - --env=XDG_DATA_DIRS=/app/share:/usr/share
  - --env=QT_QPA_PLATFORM=xcb
  # Unconditional, so the xcb above is always OURS: Utils.environment.xdg.host_env() reads
  # this marker and scrubs QT_QPA_PLATFORM from every program we launch. A
  # child that cannot reach an X server (the OpenMW flatpak ships
  # fallback-x11, so on Wayland its sandbox has no X socket) aborts during Qt
  # startup if it inherits xcb.
  - --env=_AMM_OWNS_QT_PLATFORM=1

tags:
  - modmanager
  - games
  - modding

cleanup-commands:
  # BaseApp housekeeping (WebEngine strip per build-options env above).
  - /app/cleanup-BaseApp.sh
  - mkdir -p /app/lib/ffmpeg
  # Mount points for the 32-bit compat extensions declared above.
  - mkdir -p /app/lib/i386-linux-gnu/GL

modules:
  # Python Dependencies (PySide6 excluded - provided by the BaseApp)
  - pypi-dependencies.yaml

  - name: sevenzip
    buildsystem: simple
    build-commands:
      - make -C CPP/7zip/Bundles/Alone2 -f makefile.gcc
      - install -Dm755 CPP/7zip/Bundles/Alone2/_o/7zz /app/bin/7zz
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/releases/download/25.01/7z2501-src.tar.xz
        mirror-urls:
          - https://www.7-zip.org/a/7z2501-src.tar.xz
        sha256: ed087f83ee789c1ea5f39c464c55a5c9d4008deb0efe900814f2df262b82c36e
        strip-components: 0

  - name: vgmstream
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 vgmstream-cli /app/bin/vgmstream-cli
      - install -Dm644 vgmstream-COPYING /app/share/licenses/vgmstream/COPYING
    sources:
      - type: archive
        url: https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-linux.zip
        sha256: 2f98c77f756079f63fbd119939067f1ed461d77e70993bc4cc372736d859c84a
      - type: file
        url: https://raw.githubusercontent.com/vgmstream/vgmstream/r2117/COPYING
        sha256: fcc26d35c4c4365e31f21734f846e4ee362ff0b57ba696085605a7b4768d8763
        dest-filename: vgmstream-COPYING

  # cabextract is needed by winetricks (vcredist/d3dcompiler installs).
  # Bundling it means Utils/wine/protontricks.py finds it on PATH and never falls
  # back to downloading a rolling Arch binary that may not match our glibc.
  - name: cabextract
    buildsystem: autotools
    sources:
      # cabextract.org.uk 403s CI runners; Debian ships the byte-identical
      # upstream tarball (same sha256), so pull from their pool instead.
      - type: archive
        url: http://deb.debian.org/debian/pool/main/c/cabextract/cabextract_1.11.orig.tar.gz
        mirror-urls:
          - https://www.cabextract.org.uk/cabextract-1.11.tar.gz
        sha256: b5546db1155e4c718ff3d4b278573604f30dd64c3c5bfd4657cd089b823a3ac6

  - name: libloot
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/libloot/cargo
        CARGO_NET_OFFLINE: "true"
    subdir: python
    build-commands:
      - maturin build --offline --release
      - unzip -q -o ../target/wheels/*
      - install -Dm755 ./loot/* -t /app/lib/python*/site-packages
      - pip uninstall -y maturin
    sources:
      - type: git
        url: https://github.com/loot/libloot.git
        tag: 0.29.6
        commit: 136f3983c3eec7d377f83a7e7e0b0129aa5c8fe1
      - cargo-sources.json

  - name: amethyst-mod-manager
    buildsystem: meson
    sources:
      - type: dir
        path: ..
