[package]
name = "amethyst-filegraph"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native content catalog and incremental conflict resolver for Amethyst Mod Manager"

[lib]
name = "amethyst_filegraph"
crate-type = ["cdylib", "rlib"]

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
fs2 = "0.4"
im = "15.1"
parking_lot = "0.12"
pyo3 = { version = "0.27", features = ["abi3-py312", "extension-module"] }
rmp-serde = "1.3"
rusqlite = "0.38"
serde = { version = "1", features = ["derive"] }
smallvec = "1.15"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
